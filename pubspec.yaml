name: novian_recruitement_task
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  auto_route: ^11.2.0
  copy_with_extension: ^18.0.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  material_ui: ^1.1.0
  provider: ^6.1.5+1
  rive: ^0.14.11
  rxdart: ^0.28.0
  shared_preferences: ^2.5.6
  single_value_cubit: ^1.2.3
  slang: ^4.19.2
  theme_tailor_annotation: ^4.0.2

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1
  copy_with_extension_gen: ^18.0.1
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  mocktail: ^1.0.5
  slang_build_runner: ^4.19.0
  theme_tailor: ^4.0.2
  very_good_analysis: ^11.0.0
flutter:
  uses-material-design: true

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
